<h1>Create account</h1>

@if (done()) {
  <p class="ok" role="status">{{ done() }}</p>
  <p><a routerLink="/login">Go to sign in</a></p>
} @else {
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" required>
    </label>

    <label>
      Password (at least 12 characters, with uppercase, lowercase, digit and symbol)
      <input type="password" formControlName="password" autocomplete="new-password" required>
    </label>

    <div class="hp-field" aria-hidden="true">
      <label>
        Website
        <input type="text" formControlName="website" name="website" tabindex="-1" autocomplete="off" data-testid="honeypot">
      </label>
    </div>

    @if (captchaEnabled) {
      <app-turnstile [siteKey]="siteKey" action="register" (token)="onCaptcha($event)" />
    }

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
      @for (d of details(); track d) {
        <p class="error">{{ d }}</p>
      }
    }

    <button type="submit" [disabled]="form.invalid || !securityReady || submitting()">Register</button>
  </form>
}
